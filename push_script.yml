# Contact-only box script: no VLM, grounding, or rendered observations.
nodes:
  - id: agent
    path: uv
    args: run dsrf-agent
    min_log_level: info
    env:
      AGENT: script
      SCRIPT_TASK: box_push
      SCRIPT_START_IMMEDIATELY: "true"
      MOTION_GENERATOR: ardy
    inputs:
      sim_error: sim/error
    outputs:
      - command

  - id: sim
    path: uv
    args: run --extra cu128 --extra ardy dsrf-sim
    min_log_level: info
    env:
      DEVICE: cuda
      MOTION_GENERATOR: ardy
      CHECKPOINTS_DIR: /tmp/checkpoints
      TEXT_ENCODER_MODEL: /home/sach/Desktop/encoding/model/
      TEXT_ENCODER_DEVICE: cpu
      SONIC_DIR: /tmp/GEAR-SONIC
      TASK: box_push
      IMAGE_WIDTH: "1"
      IMAGE_HEIGHT: "1"
      JPEG_QUALITY: "85"
      PUBLISH_OBSERVATIONS: "false"
      VIEWER: none
      REFERENCE_GHOST: "false"
      DEMO_MAX_COMMANDS: "1"
    inputs:
      command: agent/command
    outputs:
      - error
