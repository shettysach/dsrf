# One contact-free, feedback-controlled ARDY motion script.
nodes:
  - id: agent
    path: uv
    args: run dsrf-agent
    min_log_level: info
    env:
      AGENT: script
      SCRIPT_TASK: push_motion
      SCRIPT_PROMPT: walk forward with both arms held forward
      SCRIPT_START_IMMEDIATELY: "true"
      MOTION_GENERATOR: ardy
      PUSH_MOTION_APPROACH_X: "${PUSH_MOTION_APPROACH_X:-2.0}"
      PUSH_MOTION_GOAL_X: "${PUSH_MOTION_GOAL_X:-6.0}"
    inputs:
      sim_error: sim/error
    outputs:
      - command

  - id: sim
    path: uv
    args: run --extra cu128 --extra ardy dsrf-sim
    min_log_level: info
    env:
      DEVICE: cuda
      MOTION_GENERATOR: ardy
      CHECKPOINTS_DIR: "${CHECKPOINTS_DIR:-/tmp/checkpoints}"
      TEXT_ENCODER_MODEL: "${TEXT_ENCODER_MODEL:-/home/sach/Desktop/encoding/model/}"
      TEXT_ENCODER_DEVICE: cuda
      SONIC_DIR: /tmp/GEAR-SONIC
      TASK: push_motion
      PUBLISH_OBSERVATIONS: "false"
      VIEWER: native
      REFERENCE_GHOST: "${REFERENCE_GHOST:-true}"
      DEMO_MAX_COMMANDS: "1"
      DEMO_VIDEO_PATH: "${DEMO_VIDEO_PATH:-}"
      ARDY_SEED: "${ARDY_SEED:-0}"
      PUSH_MOTION_HANDS: "${PUSH_MOTION_HANDS:-true}"
      PUSH_MOTION_NAVIGATION_SPEED: "${PUSH_MOTION_NAVIGATION_SPEED:-0.4}"
      PUSH_MOTION_SPEED: "${PUSH_MOTION_SPEED:-0.2}"
      PUSH_MOTION_REACH_WINDOWS: "${PUSH_MOTION_REACH_WINDOWS:-1}"
    inputs:
      command: agent/command
    outputs:
      - error
