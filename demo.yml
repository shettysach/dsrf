# yaml-language-server: $schema=https://raw.githubusercontent.com/dora-rs/dora/v1.0.0-rc.4/dora-schema.json

nodes:
  - id: agent
    path: uv
    args: run dsrf-agent
    min_log_level: warn
    env:
      VLM_URL: http://127.0.0.1:8080
      VLM_TIMEOUT: "120"
      VLM_SYSTEM_PROMPT: tasks/portrait_corridors/TASK.md
      VLM_USER_PROMPT: prompt/PLANNER_USER.md
      MOTION_GENERATOR: kinematic_planner
    inputs:
      observation: sim/observation
      grounding_result: sim/grounding_result
      planning_error: motion-gen/error
      sim_error: sim/error
    outputs:
      - command
      - grounding_request

  - id: motion-gen
    path: uv
    args: run dsrf-motion-gen
    min_log_level: warn
    env:
      DEVICE: cuda
      MOTION_GENERATOR: kinematic_planner
      PLANNER_ONNX: /tmp/GEAR-SONIC/planner_sonic.onnx
    inputs:
      command: agent/command
    outputs:
      - motion
      - error

  - id: sim
    path: uv
    args: run dsrf-sim
    min_log_level: warn
    env:
      DEVICE: cuda
      # Direct tracking consumes the planner's qpos reference through MJLab PD.
      CONTROLLER: direct
      # Diagnostic defaults: no lateral position spring or yaw position tracking.
      DIRECT_ROOT_XY_KP: "${DIRECT_ROOT_XY_KP:-0}"
      DIRECT_ROOT_XY_KD: "${DIRECT_ROOT_XY_KD:-50}"
      DIRECT_ROOT_Z_KP: "${DIRECT_ROOT_Z_KP:-500}"
      DIRECT_ROOT_Z_KD: "${DIRECT_ROOT_Z_KD:-100}"
      DIRECT_ROOT_RP_KP: "${DIRECT_ROOT_RP_KP:-100}"
      DIRECT_ROOT_RP_KD: "${DIRECT_ROOT_RP_KD:-25}"
      DIRECT_ROOT_YAW_KP: "${DIRECT_ROOT_YAW_KP:-0}"
      DIRECT_ROOT_YAW_KD: "${DIRECT_ROOT_YAW_KD:-10}"
      DIRECT_MAX_FORCE: "${DIRECT_MAX_FORCE:-1000}"
      DIRECT_MAX_TORQUE: "${DIRECT_MAX_TORQUE:-200}"
      DIRECT_WRENCH_LOG_PATH: "${DIRECT_WRENCH_LOG_PATH:-}"
      TASK: portrait-corridors
      IMAGE_WIDTH: "640"
      IMAGE_HEIGHT: "480"
      JPEG_QUALITY: "85"
      VIEWER: native
      REFERENCE_GHOST: "${REFERENCE_GHOST:-false}"
    inputs:
      motion: motion-gen/motion
      grounding_request: agent/grounding_request
    outputs:
      - observation
      - grounding_result
      - error
