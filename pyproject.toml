[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dsrf"
version = "0.1.0"
description = "Dora pipeline for G1 motion generation and SONIC tracking in MJLab"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dora-rs==1.0.0rc4",
    "imageio>=2.37,<3",
    "imageio-ffmpeg>=0.6,<0.7",
    "numpy>=2.4.0,<2.5",
    "pillow>=11,<13",
    "pyarrow>=20",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
ardy = [
    "accelerate>=1.0",
    "ardy",
    "bitsandbytes>=0.50.0",
    "transformers>=4.51",
]
cpu = [
    "mjlab",
    "onnxruntime>=1.23.0,<1.27.0",
    "torch>=2.7.0",
    "torchvision",
]
cu128 = [
    "mjlab",
    "onnxruntime-gpu>=1.23.0,<1.27.0",
    "torch>=2.7.0",
    "torchvision",
]

[project.scripts]
dsrf-agent = "nodes.agent:main"
dsrf-sim = "nodes.sim:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu128" }],
]

[tool.uv.sources]
ardy = { git = "https://github.com/shettysach/ardy", branch = "main" }
mjlab = { git = "https://github.com/mujocolab/mjlab", tag = "v1.6.0" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent",
    "src/tracker",
    "src/motion_gen",
    "src/nodes",
    "src/shared",
    "src/sim",
    "src/script",
    "tasks",
]

[tool.hatch.build]
artifacts = ["tasks/**/*.md"]

[tool.ruff]
line-length = 88
src = ["src", "tasks", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that load checkpoints or create an MJLab simulation",
]
