# One logical, feedback-controlled approach/contact/push. No VLM or assistance.
nodes:
  - id: agent
    path: uv
    args: run dsrf-agent
    min_log_level: info
    env:
      AGENT: script
      SCRIPT_TASK: box_push
      SCRIPT_PROMPT: walk forward
      SCRIPT_START_IMMEDIATELY: "false"
      BOX_PUSH_START_X: "${BOX_PUSH_START_X:-3.0}"
      BOX_PUSH_GOAL_X: "${BOX_PUSH_GOAL_X:-6.0}"
      MOTION_GENERATOR: ardy
    inputs:
      sim_error: sim/error
      observation: sim/observation
    outputs:
      - command

  - id: sim
    path: uv
    args: run --extra cu128 --extra ardy dsrf-sim
    min_log_level: info
    env:
      DEVICE: cuda
      MOTION_GENERATOR: ardy
      CHECKPOINTS_DIR: "${CHECKPOINTS_DIR:-/tmp/checkpoints}"
      TEXT_ENCODER_MODEL: "${TEXT_ENCODER_MODEL:-/home/sach/Desktop/encoding/model/}"
      TEXT_ENCODER_DEVICE: cuda
      SONIC_DIR: /tmp/GEAR-SONIC
      TASK: box_push
      BOX_PUSH_START_X: "${BOX_PUSH_START_X:-3.0}"
      BOX_PUSH_GOAL_X: "${BOX_PUSH_GOAL_X:-6.0}"
      IMAGE_WIDTH: "1280"
      IMAGE_HEIGHT: "720"
      JPEG_QUALITY: "85"
      PUBLISH_OBSERVATIONS: "true"
      VIEWER: native
      REFERENCE_GHOST: "${REFERENCE_GHOST:-true}"
      DEMO_MAX_COMMANDS: "1"
      DEMO_VIDEO_PATH: "${DEMO_VIDEO_PATH:-}"
      ARDY_SEED: "${ARDY_SEED:-0}"
      PUSH_NAVIGATION_SPEED: "${PUSH_NAVIGATION_SPEED:-0.4}"
      PUSH_SPEED: "${PUSH_SPEED:-0.15}"
      PUSH_STANDOFF: "${PUSH_STANDOFF:-0.40}"
      PUSH_WELD: "${PUSH_WELD:-true}"
    inputs:
      command: agent/command
    outputs:
      - error
      - observation
