name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked --extra cpu --extra ardy --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Unit tests
        run: uv run python -m pytest -m "not integration" -q
