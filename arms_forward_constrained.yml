# One ARDY arms-forward prompt with two final palm-position constraints.
nodes:
  - id: agent
    path: uv
    args: run dsrf-agent
    min_log_level: info
    env:
      AGENT: script
      SCRIPT_TASK: box_push
      SCRIPT_PROMPT: extend both arms straight forward and hold them there
      SCRIPT_START_IMMEDIATELY: "true"
      MOTION_GENERATOR: ardy
    inputs:
      sim_error: sim/error
    outputs:
      - command

  - id: sim
    path: uv
    args: run --extra cu128 --extra ardy dsrf-sim
    min_log_level: info
    env:
      DEVICE: cuda
      MOTION_GENERATOR: ardy
      CHECKPOINTS_DIR: /tmp/checkpoints
      TEXT_ENCODER_MODEL: /home/sach/Desktop/encoding/model/
      TEXT_ENCODER_DEVICE: cuda
      SONIC_DIR: /tmp/GEAR-SONIC
      TASK: box_push
      IMAGE_WIDTH: "1280"
      IMAGE_HEIGHT: "720"
      JPEG_QUALITY: "85"
      PUBLISH_OBSERVATIONS: "false"
      VIEWER: native
      REFERENCE_GHOST: "${REFERENCE_GHOST:-true}"
      DEMO_MAX_COMMANDS: "1"
    inputs:
      command: agent/command
    outputs:
      - error
