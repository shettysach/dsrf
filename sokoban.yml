# yaml-language-server: $schema=https://raw.githubusercontent.com/dora-rs/dora/v1.0.0-rc.4/dora-schema.json

nodes:
  - id: agent
    path: uv
    args: run dsrf-agent
    min_log_level: warn
    env:
      AGENT: "${AGENT:-vlm}"
      KEYBOARD_SOCKET: "${KEYBOARD_SOCKET:-/tmp/dsrf-sokoban-keys.sock}"
      VLM_URL: http://127.0.0.1:8080
      VLM_TIMEOUT: "120"
      VLM_SYSTEM_PROMPT: tasks/sokoban/TASK.md
      VLM_USER_PROMPT: prompt/PLANNER_USER.md
      VLM_RECENT_TURNS: "${VLM_RECENT_TURNS:-3}"
      VLM_ENABLE_FINISHED: "true"
      MOTION_GENERATOR: kinematic_planner
      DEMO_MAX_COMMANDS: "${DEMO_MAX_COMMANDS:-}"
    inputs:
      observation: sim/observation
      grounding_result: sim/grounding_result
      sim_error: sim/error
    outputs:
      - command
      - grounding_request

  - id: sim
    path: uv
    args: run dsrf-sim
    min_log_level: warn
    env:
      AGENT: "${AGENT:-vlm}"
      DEVICE: cuda
      MOTION_GENERATOR: kinematic_planner
      PLANNER_ONNX: /tmp/GEAR-SONIC/planner_sonic.onnx
      SONIC_DIR: /tmp/GEAR-SONIC
      TASK: sokoban
      IMAGE_WIDTH: "1280"
      IMAGE_HEIGHT: "720"
      JPEG_QUALITY: "85"
      VIEWER: "${VIEWER:-native}"
      KEYBOARD_SOCKET: "${KEYBOARD_SOCKET:-/tmp/dsrf-sokoban-keys.sock}"
      REFERENCE_GHOST: "${REFERENCE_GHOST:-false}"
      SOKOBAN_LEVEL: "${SOKOBAN_LEVEL:-1}"
      DEMO_VIDEO_PATH: "${DEMO_VIDEO_PATH:-}"
      STOP_ON_STAND: "${STOP_ON_STAND:-false}"
      DEMO_MAX_COMMANDS: "${DEMO_MAX_COMMANDS:-}"
      DEMO_TIMEOUT_SECONDS: "${DEMO_TIMEOUT_SECONDS:-}"
    inputs:
      command: agent/command
      grounding_request: agent/grounding_request
    outputs:
      - observation
      - grounding_result
      - error
