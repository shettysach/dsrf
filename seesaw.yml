# yaml-language-server: $schema=https://raw.githubusercontent.com/dora-rs/dora/v1.0.0-rc.4/dora-schema.json

nodes:
  - id: capture
    path: uv
    args: run python scripts/record_seesaw_gif.py
    env:
      DEVICE: "${DEVICE:-cuda:0}"
      SEESAW_GIF_PATH: "${SEESAW_GIF_PATH:-/tmp/see-saw.gif}"
      SEESAW_GIF_SECONDS: "${SEESAW_GIF_SECONDS:-3}"
      SEESAW_GIF_FPS: "${SEESAW_GIF_FPS:-20}"
      IMAGE_WIDTH: "${IMAGE_WIDTH:-640}"
      IMAGE_HEIGHT: "${IMAGE_HEIGHT:-480}"
