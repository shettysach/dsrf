# One continuous, deterministic two-palm box push.
nodes:
  - id: agent
    path: uv
    args: run dsrf-agent
    min_log_level: info
    env:
      AGENT: script
      SCRIPT_TASK: box_push
      SCRIPT_PROMPT: Reach forward with both open palms and push the box straight ahead while taking one short step.
      SCRIPT_START_IMMEDIATELY: "false"
      BOX_PUSH_GOAL_X: "1.90"
      MOTION_GENERATOR: ardy
    inputs:
      sim_error: sim/error
      observation: sim/observation
    outputs:
      - command

  - id: sim
    path: uv
    args: run --extra cu128 --extra ardy dsrf-sim
    min_log_level: info
    env:
      DEVICE: cuda
      MOTION_GENERATOR: ardy
      CHECKPOINTS_DIR: /tmp/checkpoints
      TEXT_ENCODER_MODEL: /home/sach/Desktop/encoding/model/
      TEXT_ENCODER_DEVICE: cuda
      SONIC_DIR: /tmp/GEAR-SONIC
      TASK: box_push
      BOX_PUSH_GOAL_X: "1.90"
      IMAGE_WIDTH: "1280"
      IMAGE_HEIGHT: "720"
      JPEG_QUALITY: "85"
      PUBLISH_OBSERVATIONS: "true"
      VIEWER: native
      REFERENCE_GHOST: "${REFERENCE_GHOST:-true}"
      DEMO_MAX_COMMANDS: "1"
    inputs:
      command: agent/command
    outputs:
      - error
      - observation
