# yaml-language-server: $schema=https://raw.githubusercontent.com/dora-rs/dora/v1.0.0-rc.4/dora-schema.json

nodes:
  - id: agent
    path: uv
    args: run dsrf-agent
    min_log_level: warn
    env:
      VLM_URL: http://127.0.0.1:8080
      VLM_TIMEOUT: "120"
      VLM_SYSTEM_PROMPT: tasks/portrait_corridors/TASK.md
      VLM_USER_PROMPT: prompt/PLANNER_USER.md
      MOTION_GENERATOR: kinematic_planner
    inputs:
      observation: sim/observation
      grounding_result: sim/grounding_result
      sim_error: sim/error
    outputs:
      - command
      - grounding_request

  - id: sim
    path: uv
    args: run dsrf-sim
    min_log_level: warn
    env:
      DEVICE: cuda
      MOTION_GENERATOR: kinematic_planner
      PLANNER_ONNX: /tmp/GEAR-SONIC/planner_sonic.onnx
      SONIC_DIR: /tmp/GEAR-SONIC
      TASK: portrait-corridors
      IMAGE_WIDTH: "640"
      IMAGE_HEIGHT: "480"
      JPEG_QUALITY: "85"
      VIEWER: native
      REFERENCE_GHOST: "${REFERENCE_GHOST:-false}"
    inputs:
      command: agent/command
      grounding_request: agent/grounding_request
    outputs:
      - observation
      - grounding_result
      - error
